name: Check and package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --include=dev
      - name: Check, test and create credential-free archives
        run: npm run release
      - name: Build and smoke-test ordinary server image
        run: |
          docker build --build-arg BUILD_COMMIT="$(git rev-parse HEAD)" --build-arg BUILD_DIRTY=false -t channel-desk:ci .
          bash deploy/server/smoke-container.sh channel-desk:ci
          docker run --rm -e CHANNEL_DESK_DOMAIN=ci.example.com -v "$PWD/deploy/server/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.8-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/check-release-tag.mjs "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: channel-desk-release
          path: |
            release/*.zip
            release/SHA256SUMS.txt
            release/release-manifest.json
          if-no-files-found: error
          retention-days: 30
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: channel-desk-release
          path: release
      - name: Publish versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/*.zip release/SHA256SUMS.txt release/release-manifest.json --verify-tag --title "Channel Desk $RELEASE_TAG" --generate-notes
